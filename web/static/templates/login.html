<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Sign in · Google Maps Scraper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="share-page">
    <main class="login-main">
        <form class="login-card" method="post" action="/login">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
                </span>
                <span class="brand-name">Google Maps Scraper</span>
            </div>
            <div>
                <h1>Sign in</h1>
                <p class="subtle">Enter the team password to continue.</p>
            </div>
            {{if .Error}}<div class="error-message" role="alert">{{.Error}}</div>{{end}}
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Sign in</button>
        </form>
    </main>
</body>
</html>
